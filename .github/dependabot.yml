version: 2
# Minor and patch updates arrive grouped; each major update gets its own PR.
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      functions-minor:
        update-types: [minor, patch]
    ignore:
      # @types/node follows the Node runtime (22 LTS), not the latest Node release.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
  - package-ecosystem: npm
    directory: /infra
    schedule: { interval: weekly }
    groups:
      infra-minor:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # cdk-nag 3 replaces NagSuppressions with Validations.acknowledge() and has no regex/prefix
      # suppressions yet; migrate deliberately.
      - dependency-name: cdk-nag
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions-minor:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    ignore:
      # Node: stay on LTS lines (even majors).
      - dependency-name: node
        versions: ['23.x', '25.x', '27.x']
