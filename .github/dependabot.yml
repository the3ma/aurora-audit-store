version: 2
# Minor and patch updates arrive grouped; each major update gets its own PR - except packages that
# only work in lockstep (eslint + @eslint/js), which always arrive together.
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      eslint:
        patterns: ['eslint', '@eslint/*']
      functions-minor:
        update-types: [minor, patch]
    ignore:
      # @types/node follows the Node runtime (22 LTS), not the latest Node release.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # typescript-eslint supports TypeScript < 6.1; upgrade the two together by hand.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Local integration tests must run the same PostgreSQL major as Aurora and CI (16).
      - dependency-name: embedded-postgres
        update-types: [version-update:semver-major]
  - package-ecosystem: npm
    directory: /infra
    schedule: { interval: weekly }
    groups:
      eslint:
        patterns: ['eslint', '@eslint/*']
      infra-minor:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # cdk-nag 3 replaces NagSuppressions with Validations.acknowledge() and has no regex/prefix
      # suppressions yet; migrate deliberately.
      - dependency-name: cdk-nag
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions-minor:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    ignore:
      # The image runs the Lambda runtime's Node line (22); move both together, by hand.
      - dependency-name: node
        update-types: [version-update:semver-major]
